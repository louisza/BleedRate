# Tax Rebates (reduces final tax owed)
primary_rebate: 17820      # All taxpayers
secondary_rebate: 9765     # Age 65+
tertiary_rebate: 3249      # Age 75+

# Tax Thresholds (income below which no tax is payable)
threshold_under_65: 99000
threshold_65_to_74: 153250
threshold_75_plus: 171300

# Medical Aid Tax Credits (monthly amounts in Rand)
med_credit_first_two: 376  # First two members
med_credit_additional: 254 # Each additional member

# Unemployment Insurance Fund
uif_employee_rate: 0.01    # 1% of salary
uif_monthly_cap: 177.12    # Maximum monthly contribution

# Value Added Tax
vat_rate: 0.15             # 15%

# Fuel Levies (Rand per litre, statutory Budget 2026 rates, permanent from 6 May 2026)
# NOTE: Temporary R3.00/L GFL relief active 1 Apr - 5 May 2026 (oil price spike)
#   During relief: petrol GFL=R1.10/L (total govt=R3.35/L), diesel GFL=R0.93/L (total govt=R3.18/L)
fuel_gfl_petrol: 4.10      # General Fuel Levy - Petrol (includes carbon component)
fuel_gfl_diesel: 3.93      # General Fuel Levy - Diesel (includes carbon component)
fuel_raf: 2.25             # Road Accident Fund levy
fuel_carbon_petrol: 0.19   # Carbon fuel levy - Petrol (component of GFL above)
fuel_carbon_diesel: 0.23   # Carbon fuel levy - Diesel (component of GFL above)
fuel_total_govt_petrol: 6.35  # Total government levy - Petrol (GFL + RAF, statutory)
fuel_total_govt_diesel: 6.18  # Total government levy - Diesel (GFL + RAF, statutory)

# Environmental Levy
electricity_env_levy: 0.035 # R0.035 per kWh

# Health Promotion Levy (sugary drinks)
hpl_per_gram_over_threshold: 0.021  # R0.021 per gram of sugar above threshold
hpl_threshold_g_per_100ml: 4.0      # First 4g/100ml exempt

# Alcohol Excise Duties (2026/27, effective 1 April 2026, +3.4% increase)
# Source: National Treasury Budget 2026
# 
# CURRENT FRAMEWORK:
# - Beer/Fermented: R149.98 per litre of absolute alcohol (LAA)
# - Wine: R6.15 per litre (volumetric - NOT based on alcohol content)
# - Fortified Wine: higher rate per litre
# - Spirits: R302.84 per LAA
#
# POLICY GUIDELINES (excise as % of weighted average retail price):
# - Wine: 11% (proposed increase to 16%)
# - Beer: 23% (proposed increase to 28%)
# - Spirits: 36% (proposed increase to 42%)

beer_excise_per_laa: 149.98         # R149.98 per litre of absolute alcohol
beer_typical_abv: 0.05              # 5% ABV typical for calculator estimates
wine_excise_per_litre: 6.15         # R6.15 per LITRE OF WINE (volumetric, NOT LAA-based)
sparkling_wine_excise_per_litre: 19.68  # R19.68 per litre
fortified_wine_excise_per_litre: 8.36  # (unchanged, update when confirmed)
spirits_excise_per_laa: 302.84      # R302.84 per litre of absolute alcohol
cider_excise_per_laa: 149.98        # R149.98 per litre of absolute alcohol (same as beer)
spirits_typical_abv: 0.40           # 40% ABV typical for calculator estimates
laa_to_ml_ratio: 1000               # 1 LAA = 1000ml (for ABV calculations)

# Tobacco Excise Duties (2026/27, +3.4% increase)
cigarette_excise_per_20: 22.81      # R22.81 per 20 cigarettes (specific excise)
cigarette_ad_valorem_rate: 0.30     # 30% ad valorem (of retail price)
heated_tobacco_per_20: 17.68        # R17.68 per 20 sticks
vaping_per_ml: 3.29                 # R3.29 per ml
pipe_tobacco_excise_per_gram: 0.3324  # R8.31 per 25g = R0.3324 per gram
cigar_excise_per_gram: 6.04         # R138.96 per 23g = R6.04 per gram

# Capital Gains Tax (exclusions changed for 2026/27)
cgt_annual_exclusion: 50000         # Annual exclusion (individuals)
cgt_death_exclusion: 440000         # Year of death exclusion
cgt_primary_residence_exclusion: 3000000  # Primary residence exclusion
cgt_inclusion_rate: 0.18            # 18% inclusion rate (unchanged)
cgt_effective_max_rate: 0.081       # ~8.1% (18% × 45%)

# Other Levies
plastic_bag_levy: 0.32     # Per bag (Rand)
tyre_levy_per_kg: 2.30     # R2.30 per kg of tyre mass
tv_license_annual: 265     # R265 per year

# Sugar Tax (Health Promotion Levy)
sugar_tax_per_gram: 0.021  # R0.021 per gram of sugar above 4g/100ml threshold

# Import Duties (Customs Duties on Consumer Goods)
import_duty_clothing: 0.40
import_duty_footwear: 0.30
import_duty_electronics_low: 0.00
import_duty_electronics_high: 0.15
import_duty_general: 0.20
import_duty_weighted_avg: 0.20

# Airport Taxes & Aviation Levies
airport_tax_domestic: 100
passenger_service_charge_domestic: 25
airport_tax_international: 190
passenger_service_charge_international: 75
tourism_levy_international: 30

# Tourism Levies
accommodation_tourism_levy_rate: 0.01

# Import VAT
import_vat_rate: 0.15
import_vat_threshold: 0

# Municipal Services
municipal_water_typical_per_kl: 25
municipal_sewerage_as_percent_of_water: 0.80
municipal_refuse_typical_monthly: 250

# Investment Taxes
dividends_tax_rate: 0.20   # 20% on SA dividends (unchanged)

